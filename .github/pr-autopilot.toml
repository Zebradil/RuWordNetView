enabled = true

# Documentation only — the engine never reads this table (ADR 0012). It records what onboarding
# concluded about the repository, and why the policy below looks the way it does.
[risk]
# No release tooling and no tags. Deployment is manual (`make deploy` rsync plus `docker compose up`
# on the server, confirmed by the operator), so a merge to main reaches production only when a
# human deploys it.
release_mode      = "none"
deploys_from_main = false
# With the checks added at onboarding, CI runs go vet, gofmt and go test, builds both Docker images
# and starts the pinned Postgres, so an update that breaks the API, a build or an image pull fails.
# The only test parses templates; nothing exercises the database layer against Postgres, so a
# behaviour change in pgx or Postgres would pass.
test_confidence   = "low"
criticality       = "low"      # operator's call

# The only thing the engine consults. Values are verdicts; an update class that is absent here
# escalates. Default shape: low test confidence is offset by manual deployment and low criticality.
# Majors escalate, notably Postgres, whose data directory does not survive a major upgrade.
[policy]
patch    = "merge"
minor    = "merge"
major    = "escalate"
digest   = "merge"
pin      = "merge"
lockfile = "merge"

[limits]
max_merges    = 10   # merges per sweep
max_repairs   = 3    # agent dispatches per sweep
attempt_cap   = 2    # repair attempts per pull request, then escalate for good
lease_minutes = 30   # how long one sweep's claim on a pull request lasts; also the repair agent's time limit

[repair]
strategy = "bot-branch"   # bot-branch | side-pr

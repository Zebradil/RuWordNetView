x-logging: &default-logging
  driver: json-file
  options:
    max-file: '3'
    max-size: '10m'

services:
  app:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
    image: ruwordnetview:prod
    logging: *default-logging
    restart: unless-stopped

  database:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    logging: *default-logging
    restart: unless-stopped
    volumes:
      # Postgres 18+ images keep data in a major-version subdirectory (/var/lib/postgresql/18/docker) and
      # refuse to start with a mount at the old .../data path. A new volume per major version leaves the
      # previous one intact as a rollback until a dump of it has been restored here.
      - pg18_data:/var/lib/postgresql:rw

  proxy:
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:?}
      - CERTBOT_AUTHENTICATOR=dns-cloudflare
      - STAGING=0
    # Has to be built beforehand.
    # See https://github.com/Zebradil/RuWordNetView/blob/master/Makefile
    image: ruwordnetview:nginx
    logging: *default-logging
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    volumes:
      - nginx_cache:/var/cache/nginx:rw
      - nginx_secrets:/etc/letsencrypt

volumes:
  pg18_data:
  nginx_cache:
  nginx_secrets:

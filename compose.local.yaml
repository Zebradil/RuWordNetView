services:
  app-local:
    depends_on:
      database-local:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_HOST: database-local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
    image: ruwordnetview:prod
    ports:
      - '127.0.0.1:8000:8000'

  database-local:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    healthcheck:
      interval: 5s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      timeout: 5s
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - db_data_local:/var/lib/postgresql/data:rw

volumes:
  db_data_local:
